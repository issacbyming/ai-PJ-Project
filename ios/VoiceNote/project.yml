# 備援方案：如果 VoiceNote.xcodeproj 打不開（例如 Xcode 版本太舊），
# 安裝 XcodeGen（brew install xcodegen）後在這個資料夾執行 `xcodegen generate` 重新產生專案。
name: VoiceNote
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages:
  VoiceNoteCore:
    path: VoiceNoteCore
targets:
  VoiceNote:
    type: application
    platform: iOS
    sources:
      - VoiceNote
    dependencies:
      - package: VoiceNoteCore
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: 語記
        NSMicrophoneUsageDescription: 需要麥克風來錄下你說的話，並即時辨識成文字。
        NSSpeechRecognitionUsageDescription: 需要語音辨識把你說的話轉成文字。開啟「裝置端辨識」時不會上傳錄音。
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.voicenote
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
